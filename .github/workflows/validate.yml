name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve spec validation baseline
        id: spec_baseline
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            baseline="${{ github.event.pull_request.base.sha }}"
          else
            baseline="${{ github.event.before }}"
            if [[ "$baseline" =~ ^0+$ ]]; then
              baseline="$(git rev-parse HEAD^)"
            fi
          fi
          git cat-file -e "$baseline^{commit}"
          echo "ref=$baseline" >> "$GITHUB_OUTPUT"
      - name: Validate structured specs, policies, and installs
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=plugins/forge/skills/writing-specs/scripts \
            python3 -m unittest discover \
              -s plugins/forge/skills/writing-specs/tests -p 'test_*.py' -v
          node plugins/forge/skills/writing-specs/tests/test_mermaid_validate.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s plugins/forge/skills/using-forge/tests -p 'test_*.py' -v
          bash scripts/tests/test-agent-extension-skill.sh
          bash scripts/tests/test-maintaining-forge-layout.sh
          bash scripts/tests/test-validator-skill-roots.sh
          bash scripts/tests/test-forge-spec-docs-policy.sh
          bash scripts/tests/test-forge-spec-bundle-migration.sh
          bash scripts/tests/test-forge-artifact-contract.sh
          bash scripts/tests/test-forge-lifecycle-policy.sh
          bash scripts/tests/test-forge-bootstrap.sh
          bash scripts/tests/test-ui-design-skill-routing.sh
          bash scripts/tests/test-forge-ui-skill-install.sh
          bash scripts/tests/test-forge-visual-docs-install.sh
          bash plugins/forge/skills/writing-specs/scripts/spec-docs.sh \
            validate --root docs/specs --baseline-ref \
              "${{ steps.spec_baseline.outputs.ref }}"
          bash plugins/forge/skills/writing-specs/scripts/spec-docs.sh \
            inspect --spec docs/specs/semantic-spec-bundles/ --format json
          bash scripts/validate.sh
