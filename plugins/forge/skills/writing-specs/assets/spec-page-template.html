<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%231f5fbf'/%3E%3Cpath d='M18 16h28v6H24v9h18v6H24v11h22v6H18z' fill='white'/%3E%3C/svg%3E">
<style>
:root{--page:#f7f4ee;--surface:#fffdf8;--ink:#25282c;--muted:#687078;--line:#d8d2c7;--accent:#1f5fbf;--accent-soft:#e7eefb;--space:4px;font-size:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.65}a{color:var(--accent);text-underline-offset:.16em}a:focus-visible,select:focus-visible,input:focus-visible,[tabindex="0"]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.shell{width:min(100% - 32px,76rem);margin-inline:auto}.reading{max-width:76ch}.site-header{padding:36px 0 24px;border-bottom:1px solid var(--line);background:var(--surface)}.eyebrow{margin:0 0 8px;color:var(--muted);font:600 .78rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;text-transform:uppercase}.site-header h1{max-width:24ch;margin:0;font-size:clamp(2rem,4vw,3.4rem);line-height:1.08;letter-spacing:-.035em}.source-link{display:inline-block;margin-top:16px}.metadata{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));margin:24px 0 0;border-top:1px solid var(--line);border-left:1px solid var(--line)}.meta-row{min-width:0;padding:12px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.meta-row dt{color:var(--muted);font-size:.78rem;font-weight:650;text-transform:uppercase}.meta-row dd{margin:4px 0 0;overflow-wrap:anywhere}.tag,.status{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-size:.82rem}.status{border-color:var(--accent);color:var(--accent);font-weight:700}.relation{display:block}.relation span{color:var(--muted);font-size:.82rem}.section-nav{border-bottom:1px solid var(--line);background:var(--page)}.section-nav .shell{display:flex;gap:20px;padding-block:12px;overflow-x:auto}.section-nav a{flex:none;font-size:.9rem;font-weight:650}.document{padding-block:32px 72px}.document section{padding-block:28px;border-bottom:1px solid var(--line)}.document h2{margin:0 0 16px;font-size:1.45rem;line-height:1.25}.document h3{margin:24px 0 8px;font-size:1.12rem}.document p,.document li{max-width:76ch}.document pre{padding:16px;border:1px solid var(--line);background:var(--surface);overflow-x:auto}.table-scroll,.diagram-scroll{max-width:100%;overflow-x:auto;overscroll-behavior-inline:contain}.diagram-scroll{margin-block:16px;padding:12px;border:1px solid var(--line);background:var(--surface)}table{width:100%;min-width:42rem;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}th,td{padding:10px 12px;border:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--surface)}th[scope="row"]{width:5rem}tr:target{background:var(--accent-soft)}.empty-value{color:var(--muted)}@media(max-width:32rem){.shell{width:min(100% - 24px,76rem)}.site-header{padding-top:24px}.metadata{grid-template-columns:1fr}.document{padding-top:16px}}
</style>
</head>
<body data-forge-spec-page="forge/spec-page@1">
<header class="site-header">
  <div class="shell">
    <p class="eyebrow">Forge Spec Page · read-only</p>
    <h1>{{TITLE}}</h1>
    <a class="source-link" href="spec.md">{{SOURCE_LABEL}}</a>
    <dl class="metadata">{{METADATA}}</dl>
  </div>
</header>
<nav class="section-nav" aria-label="Spec sections"><div class="shell">{{NAVIGATION}}</div></nav>
<main class="shell document">
  <section id="overview"><h2>{{OVERVIEW_LABEL}}</h2><div class="reading">{{OVERVIEW}}</div></section>
  <section id="flows"><h2>{{FLOWS_LABEL}}</h2>{{FLOWS}}</section>
  <section id="requirements"><h2>{{REQUIREMENTS_LABEL}}</h2>{{REQUIREMENTS}}</section>
  <section id="data"><h2>{{DATA_LABEL}}</h2>{{DATA}}</section>
  <section id="acceptance"><h2>{{ACCEPTANCE_LABEL}}</h2>{{ACCEPTANCE}}</section>
  <section id="history"><h2>{{HISTORY_LABEL}}</h2><div class="reading">{{HISTORY}}</div></section>
</main>
<script type="application/json" id="forge-spec-manifest">{{MANIFEST}}</script>
</body>
</html>
