<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232557a7'/%3E%3Cpath d='M17 18h30v7H25v8h18v7H25v12h-8z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f7f3eb;
    --surface: #fffdfa;
    --text: #20262b;
    --text-muted: #626d76;
    --accent: #2557a7;
    --accent-soft: rgba(37, 87, 167, 0.12);
    --border: #d8d1c4;
    --error: #b3382e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15191c;
      --surface: #1e2428;
      --text: #e8e5de;
      --text-muted: #98a2aa;
      --accent: #8bb4ff;
      --accent-soft: rgba(139, 180, 255, 0.16);
      --border: #343d43;
      --error: #e07a70;
    }
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
  }
  /* type scale: 1.25 ratio on a 1rem base */
  h1 { font-size: 1.953rem; line-height: 1.2; margin: 0; }
  h2 { font-size: 1.563rem; line-height: 1.25; margin: 1.6rem 0 0.6rem; }
  h3 { font-size: 1.25rem; margin: 1.2rem 0 0.4rem; }
  small, .doc-meta { font-size: 0.8rem; }
  p, li { max-width: 65ch; }
  a { color: var(--accent); }

  .doc-header { border-bottom: 1px solid var(--border); background: var(--surface); }
  .doc-header-inner, .review-navigation, main { max-width: 88rem; margin: 0 auto; padding: 0 1.5rem; }
  .doc-header-inner { padding-top: 2rem; padding-bottom: 1.25rem; }
  .doc-meta { display: flex; gap: 1rem; align-items: center; color: var(--text-muted); margin: 0.5rem 0 0; }
  .status {
    display: inline-block; padding: 0.1rem 0.6rem; border: 1px solid var(--accent);
    border-radius: 999px; color: var(--accent); background: var(--accent-soft);
    font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; font-size: 0.7rem;
  }

  .review-navigation { display: flex; gap: 0.25rem; padding-top: 0.75rem; overflow-x: auto; }
  .review-navigation:empty { display: none; }
  .review-navigation a { color: var(--text-muted); font-size: 0.9rem; font-weight: 600; padding: 0.5rem 0.85rem; white-space: nowrap; min-height: 44px; }
  .review-navigation a:hover { color: var(--text); }
  :where(button, a, input, summary, [tabindex]):focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }

  main { padding-top: 1.5rem; padding-bottom: 4rem; }
  .review-component { scroll-margin-top: 1rem; padding: 1.25rem 0 2rem; border-bottom: 1px solid var(--border); }
  .review-component > :first-child { margin-top: 0; }

  table {
    border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: 0.9rem;
    font-variant-numeric: tabular-nums;
  }
  th, td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; vertical-align: top; }
  th { background: var(--surface); font-weight: 650; }
  tr:target td { background: var(--accent-soft); }

  pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.85rem; }
  pre {
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
    padding: 0.85rem 1rem; overflow-x: auto;
  }
  pre.mermaid[data-processed] { background: none; border: none; padding: 0; overflow: visible; }

  .table-scroll, .diagram-scroll {
    width: 100%; max-width: 100%; overflow-x: auto; overscroll-behavior-inline: contain;
    -webkit-overflow-scrolling: touch;
  }
  .table-scroll table { min-width: 42rem; }
  .diagram-scroll { margin: 1rem 0; border: 1px solid var(--border); background: var(--surface); }
  .diagram-scroll pre.mermaid { margin: 0; border: 0; }
  .diagram-scroll svg { display: block; height: auto; margin: 0 auto; }
  .diagram-error { border: 1px solid var(--error); padding: 0.85rem 1rem; }
  .mermaid-error-message { color: var(--error); font-weight: 650; margin: 0 0 0.5rem; }
  .mermaid-error-source { margin: 0; }

  .source-summary { margin-top: 0.75rem; color: var(--text-muted); font-size: 0.85rem; }
  .source-summary summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-variant-numeric: tabular-nums; }
  .source-summary-heading { margin: 0; color: var(--text); font-weight: 700; }
  .source-summary ul { padding-left: 1.25rem; }
  .source-summary li { max-width: none; overflow-wrap: anywhere; }
  .freshness-aggregates { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; }
  .source-row { display: grid; grid-template-columns: auto minmax(8rem, auto) minmax(12rem, 1fr) auto; gap: 0.35rem 0.75rem; align-items: center; padding: 0.55rem 0; border-bottom: 1px solid var(--border); }
  .source-role { font-weight: 650; }
  .source-error { grid-column: 2 / -1; min-height: 1.25rem; }
  .source-picker-label { display: block; font-weight: 600; color: var(--text); margin-top: 0.75rem; }
  .source-picker-label { grid-column: 2 / -1; margin: 0; font-size: 0.85rem; }
  [data-source-picker] { display: block; min-height: 44px; max-width: 100%; margin-top: 0.25rem; }
  .freshness-state { font-weight: 700; font-variant-numeric: tabular-nums; }
  .freshness-current { color: var(--accent); }
  .freshness-stale { color: var(--error); }
  .freshness-unverified { color: var(--text-muted); }
  .source-error { color: var(--error); }

  .review-check-item {
    display: flex; gap: 0.6rem; align-items: center; padding: 0.5rem 0; min-height: 44px;
    border-bottom: 1px solid var(--border); max-width: 65ch;
  }
  .review-check-item input { accent-color: var(--accent); flex: none; width: 1rem; height: 1rem; }
  .provenance { max-width: none; color: var(--text-muted); font-size: 0.85rem; overflow-wrap: anywhere; }
  .provenance span { color: var(--text); font-weight: 650; }
  .source-block, .task-card, .signature-view, .diagram-card {
    margin: 1rem 0; padding: 1rem; border: 1px solid var(--border); background: var(--surface);
  }
  .source-block > :first-child, .task-card > :first-child, .signature-view > :first-child, .diagram-card > :first-child { margin-top: 0; }
  .count-table td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .project-intro { max-width: 54rem; }
  .project-kicker { margin: 0 0 0.35rem; color: var(--accent); font-weight: 700; }
  .project-lede { margin: 0; max-width: 54ch; font-size: 1.25rem; line-height: 1.5; }
  .capability-list { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0; margin: 1.25rem 0 0; list-style: none; }
  .capability-list li { padding: 0.4rem 0.7rem; border: 1px solid var(--border); background: var(--surface); }
  .structure-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 28rem), 1fr)); }
  .structure-card { padding: 1.25rem; border: 1px solid var(--border); background: var(--surface); }
  .structure-card > :first-child { margin-top: 0; }
  .structure-ownership { margin: 1rem 0; }
  .structure-ownership div { padding: 0.75rem 0; border-top: 1px solid var(--border); }
  .structure-ownership dt { color: var(--text-muted); font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .structure-ownership dd { margin: 0.2rem 0 0; }
  .structure-links h4 { margin-bottom: 0.25rem; }
  .structure-links ul, .derived-evidence ul { padding-left: 1.2rem; }
  .structure-support, .derived-evidence, .developer-disclosure, .spec-detail { margin-top: 1rem; }
  .structure-support > summary, .derived-evidence summary, .developer-disclosure > summary, .spec-detail > summary { min-height: 44px; cursor: pointer; display: flex; align-items: center; color: var(--text-muted); font-weight: 650; }
  .developer-disclosure > summary { font-size: 1.1rem; }
  .spec-index { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); }
  .spec-index-card { padding: 1rem; border-left: 3px solid var(--accent); background: var(--surface); }
  .spec-index-card > :first-child { margin-top: 0; }

  .project-workspace {
    display: grid; grid-template-columns: minmax(16rem, 19rem) minmax(0, 1fr);
    gap: 2rem; align-items: start;
  }
  .project-master {
    position: sticky; top: 1rem; max-height: calc(100vh - 2rem); min-width: 0;
    display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid var(--border); border-radius: 4px; background: var(--surface);
  }
  .project-master-header { flex: none; padding: 1rem; border-bottom: 1px solid var(--border); }
  .project-master-title { margin: 0 0 0.75rem; font-size: 1rem; font-weight: 750; }
  .project-search-label {
    display: block; margin-bottom: 0.35rem; color: var(--text-muted);
    font-size: 0.8rem; font-weight: 700;
  }
  .project-search {
    width: 100%; min-height: 44px; padding: 0.6rem 0.75rem;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg); color: var(--text); font: inherit;
  }
  .project-search-empty { margin: 0.65rem 0 0; color: var(--text-muted); font-size: 0.85rem; }
  .project-tree-navigation {
    flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding: 0.5rem 0.35rem 0.75rem 0.5rem; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .project-tree-navigation::-webkit-scrollbar { width: 8px; }
  .project-tree-navigation::-webkit-scrollbar-track { background: transparent; }
  .project-tree-navigation::-webkit-scrollbar-thumb {
    border: 2px solid transparent; border-radius: 999px;
    background: var(--border); background-clip: padding-box;
  }
  .project-tree-branch[hidden] { display: none; }
  .project-tree-branch {
    position: relative; display: grid; grid-template-columns: 2rem minmax(0, 1fr); align-items: start;
  }
  .project-tree-group {
    grid-column: 1 / -1;
    margin-left: 0.75rem; padding-left: 0.45rem; border-left: 1px solid var(--border);
  }
  .project-tree-toggle {
    position: relative; z-index: 1; grid-column: 1; grid-row: 1;
    width: 2rem; min-height: 44px; padding: 0; border: 0; border-radius: 4px;
    background: transparent; color: var(--text-muted); cursor: pointer;
  }
  .project-tree-toggle:hover { background: var(--accent-soft); color: var(--text); }
  .project-tree-toggle::before {
    display: inline-block; content: "▸"; transition: transform 120ms ease;
  }
  .project-tree-toggle[aria-expanded="true"]::before { transform: rotate(90deg); }
  .project-tree-item {
    position: relative; z-index: 0; grid-column: 1 / -1; grid-row: 1;
    display: flex; align-items: center; min-height: 44px; min-width: 0;
    padding: 0.45rem 0.6rem 0.45rem 2.15rem; border-left: 3px solid transparent;
    color: var(--text-muted); text-decoration: none; font-size: 0.88rem; line-height: 1.3;
  }
  .project-tree-item:hover { color: var(--text); background: var(--accent-soft); }
  .project-tree-item[aria-selected="true"] {
    border-left-color: var(--accent); background: var(--accent-soft); color: var(--text); font-weight: 700;
  }
  .project-tree-item[aria-expanded="false"] + .project-tree-group { display: none; }
  .project-tree-label { min-width: 0; overflow-wrap: anywhere; }
  .project-detail-pane { min-width: 0; }
  .project-detail[hidden] { display: none; }
  .project-detail { min-width: 0; padding: 0 0 4rem; }
  .project-detail > h2 { margin-top: 0; }
  .project-detail-kicker {
    margin: 0 0 0.35rem; color: var(--accent); font-size: 0.8rem; font-weight: 700;
  }
  .project-section-lede { max-width: 62ch; color: var(--text-muted); font-size: 1.05rem; }
  .project-index-list { margin: 1rem 0; padding: 0; list-style: none; border-top: 1px solid var(--border); }
  .project-index-list li {
    display: grid; grid-template-columns: minmax(10rem, 1fr) minmax(0, 1.4fr);
    gap: 0.35rem 1rem; align-items: start; max-width: none; padding: 0.8rem 0;
    border-bottom: 1px solid var(--border);
  }
  .project-index-list li > code, .project-index-list li > span { color: var(--text-muted); overflow-wrap: anywhere; }
  .project-back {
    display: none; min-height: 44px; margin: 0 0 1rem; padding: 0.5rem 0.8rem;
    border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text);
    font: inherit; font-weight: 700; cursor: pointer;
  }
  .structure-key-files { margin: 1.5rem 0; }
  .structure-key-files ul { padding-left: 1.2rem; }
  .project-evidence { margin-top: 1.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border); }
  .project-evidence > summary {
    min-height: 44px; display: flex; align-items: center; cursor: pointer;
    color: var(--text-muted); font-weight: 700;
  }
  .project-detail .source-summary-open { margin-top: 0; }

  @media (max-width: 43.75rem) {
    .doc-header-inner, .review-navigation, main { padding-left: 1rem; padding-right: 1rem; }
    .diagram-scroll.is-wide svg { min-width: 48rem; max-width: none; }
    .table-scroll table { min-width: 42rem; }
    .source-row { grid-template-columns: 1fr auto; }
    .source-row > code { grid-column: 1 / -1; }
    .source-error, .source-picker-label { grid-column: 1 / -1; }
    .project-workspace { display: block; }
    .project-master { position: static; max-height: none; overflow: visible; }
    .project-tree-navigation { overflow: visible; }
    .project-detail-pane { display: none; }
    .project-workspace.is-detail .project-master { display: none; }
    .project-workspace.is-detail .project-detail-pane { display: block; }
    .project-workspace.is-detail .project-back { display: inline-flex; align-items: center; }
    .project-index-list li { grid-template-columns: 1fr; }
  }

  @media print {
    .review-navigation { display: none; }
    body { background: #fff; color: #000; }
    .review-component::before {
      content: attr(data-title); display: block; font-size: 1.563rem; font-weight: 700;
      margin: 1.5rem 0 0.75rem; border-bottom: 1px solid #000; padding-bottom: 0.25rem;
    }
    table, pre, svg { page-break-inside: avoid; }
    .table-scroll, .diagram-scroll { overflow: visible; border: 0; }
    .diagram-scroll.is-wide svg { min-width: 0; max-width: 100%; }
    .project-workspace { display: block; }
    .project-master, .project-back { display: none !important; }
    .project-detail-pane, .project-detail { display: block !important; }
    .project-detail { break-before: page; }
  }
  .metric-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:1px;margin:16px 0;padding:0;background:var(--border);border:1px solid var(--border)}.metric-strip .metric{margin:0;padding:12px 16px;background:var(--surface)}.metric-strip dt{color:var(--text-muted);font-size:.76rem;font-weight:650}.metric-strip dd{margin:2px 0 0;font-size:1.4rem;font-variant-numeric:tabular-nums}.panel-orientation{margin:2px 0 16px;max-width:76ch;color:var(--text-muted)}
</style>
</head>
<body data-diagram-label="{{DIAGRAM_LABEL}}" data-mermaid-error="{{MERMAID_ERROR}}">
<header class="doc-header">
  <div class="doc-header-inner">
    <h1>{{TITLE}}</h1>
    <p class="doc-meta"><span class="status">{{STATUS}}</span><span>{{GENERATED_LABEL}} {{GENERATED}}</span></p>
    {{SOURCE_SUMMARY}}
  </div>
</header>
<nav class="review-navigation" aria-label="{{NAV_LABEL}}">{{NAVIGATION}}</nav>
<main>
{{CONTENT}}
</main>
<script type="application/json" id="forge-source-manifest">{{SOURCE_MANIFEST}}</script>
<script type="module">
{{FRESHNESS_RUNTIME}}
</script>
{{MERMAID}}
<script>
(function () {
  'use strict';
  if (window.mermaid) {
    mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'neutral' });
  }

  async function renderDiagrams(panel) {
    if (!window.mermaid) { return; }
    var blocks = panel.querySelectorAll('pre.mermaid:not([data-forge-rendered])');
    for (var i = 0; i < blocks.length; i++) {
      var el = blocks[i];
      el.setAttribute('data-forge-rendered', '1');
      var src = el.textContent;
      var wrapper = ensureDiagramWrapper(el, src, i);
      var valid = false;
      var parseError = null;
      try { valid = await mermaid.parse(src); } catch (e) { parseError = e; }
      if (valid) {
        try { await mermaid.run({ nodes: [el] }); continue; } catch (e2) { parseError = e2; }
      }
      var fallback = document.createElement('div');
      fallback.className = 'diagram-error';
      var message = document.createElement('p');
      message.className = 'mermaid-error-message';
      message.textContent = document.body.getAttribute('data-mermaid-error') + ': ' + errorDetails(parseError);
      var source = document.createElement('pre');
      source.className = 'mermaid-error-source';
      source.textContent = src;
      fallback.appendChild(message);
      fallback.appendChild(source);
      wrapper.replaceWith(fallback);
    }
  }

  function errorDetails(error) {
    var text = String(error && (error.str || error.message) || 'parse failed');
    var location = error && error.hash && error.hash.loc;
    if (location && location.first_line) {
      text += ' (line ' + location.first_line + ', column ' + (location.first_column || 0) + ')';
    }
    return text;
  }

  function ensureDiagramWrapper(el, src, index) {
    var wrapper = el.closest('.diagram-scroll');
    if (!wrapper) {
      wrapper = document.createElement('div');
      wrapper.className = 'diagram-scroll';
      el.parentNode.insertBefore(wrapper, el);
      wrapper.appendChild(el);
    }
    if (/^\s*(sequenceDiagram|flowchart\s+LR|graph\s+LR)/m.test(src)) {
      wrapper.classList.add('is-wide');
    }
    wrapper.setAttribute('role', 'region');
    if (!wrapper.hasAttribute('aria-label') && !wrapper.hasAttribute('aria-labelledby')) {
      var heading = wrapper.parentElement && wrapper.parentElement.querySelector('h2, h3, h4');
      if (heading) {
        if (!heading.id) { heading.id = 'diagram-title-' + index; }
        wrapper.setAttribute('aria-labelledby', heading.id);
      } else {
        wrapper.setAttribute('aria-label', document.body.getAttribute('data-diagram-label') + ' ' + (index + 1));
      }
    }
    return wrapper;
  }

  function wrapTables(panel) {
    panel.querySelectorAll('table').forEach(function (table) {
      if (table.closest('.table-scroll')) { return; }
      var wrapper = document.createElement('div');
      wrapper.className = 'table-scroll';
      wrapper.setAttribute('role', 'region');
      wrapper.setAttribute('tabindex', '0');
      table.parentNode.insertBefore(wrapper, table);
      wrapper.appendChild(table);
    });
  }

  function initProjectWorkspace() {
    var workspace = document.querySelector('[data-project-workspace]');
    if (!workspace) { return; }
    var items = Array.from(workspace.querySelectorAll('[role="treeitem"]'));
    var toggles = Array.from(workspace.querySelectorAll('[data-tree-toggle]'));
    var details = Array.from(workspace.querySelectorAll('[data-project-detail]'));
    var search = workspace.querySelector('#project-search');
    var searchEmpty = workspace.querySelector('.project-search-empty');
    var back = workspace.querySelector('.project-back');
    var selectedRoute = 'project-overview';

    function detailForHash(hash) {
      var value = String(hash || '').replace(/^#/, '');
      if (!value) { return null; }
      var direct = details.find(function (detail) { return detail.dataset.route === value; });
      if (direct) { return direct; }
      var target = document.getElementById(value);
      return target && target.closest('[data-project-detail]');
    }

    function itemForRoute(route) {
      return items.find(function (item) { return item.dataset.route === route; }) || null;
    }

    function toggleForRoute(route) {
      return toggles.find(function (toggle) { return toggle.dataset.route === route; }) || null;
    }

    function setExpanded(item, expanded) {
      if (!item || !item.hasAttribute('aria-expanded')) { return; }
      var value = expanded ? 'true' : 'false';
      item.setAttribute('aria-expanded', value);
      var toggle = toggleForRoute(item.dataset.route);
      if (toggle) {
        toggle.setAttribute('aria-expanded', value);
        toggle.setAttribute('aria-label', expanded ? toggle.dataset.collapseLabel : toggle.dataset.expandLabel);
      }
    }

    function expandAncestors(item) {
      var group = item && item.closest('[role="group"]');
      while (group) {
        var parentRoute = group.getAttribute('data-parent-route');
        var parent = itemForRoute(parentRoute);
        if (parent) { setExpanded(parent, true); }
        group = parent && parent.closest('[role="group"]');
      }
    }

    function selectRoute(route, options) {
      options = options || {};
      var detail = details.find(function (candidate) { return candidate.dataset.route === route; });
      if (!detail) { return; }
      selectedRoute = route;
      details.forEach(function (candidate) {
        var active = candidate === detail;
        candidate.hidden = !active;
        candidate.classList.toggle('is-active', active);
      });
      items.forEach(function (item) {
        var active = item.dataset.route === route;
        item.setAttribute('aria-selected', active ? 'true' : 'false');
        item.tabIndex = active ? 0 : -1;
      });
      var selected = itemForRoute(route);
      expandAncestors(selected);
      if (options.updateHash) {
        history.pushState(null, '', '#' + route);
      }
      if (options.showDetail) {
        workspace.classList.add('is-detail');
      }
      if (options.focusDetail) {
        var heading = detail.querySelector('h2');
        if (heading) {
          heading.tabIndex = -1;
          heading.focus({ preventScroll: true });
        }
      }
    }

    function visibleItems() {
      return items.filter(function (item) { return item.offsetParent !== null; });
    }

    items.forEach(function (item) {
      item.addEventListener('click', function (event) {
        event.preventDefault();
        selectRoute(item.dataset.route, { updateHash: true, showDetail: true });
      });
      item.addEventListener('keydown', function (event) {
        var visible = visibleItems();
        var index = visible.indexOf(item);
        var target = null;
        if (event.key === 'ArrowDown') { target = visible[Math.min(index + 1, visible.length - 1)]; }
        if (event.key === 'ArrowUp') { target = visible[Math.max(index - 1, 0)]; }
        if (event.key === 'Home') { target = visible[0]; }
        if (event.key === 'End') { target = visible[visible.length - 1]; }
        if (event.key === 'ArrowRight' && item.hasAttribute('aria-expanded')) {
          if (item.getAttribute('aria-expanded') === 'false') {
            setExpanded(item, true);
          } else {
            var branch = item.closest('[data-tree-branch]');
            target = branch && branch.querySelector('[role="group"] [role="treeitem"]');
          }
        }
        if (event.key === 'ArrowLeft') {
          if (item.getAttribute('aria-expanded') === 'true') {
            setExpanded(item, false);
          } else {
            var group = item.closest('[role="group"]');
            target = group && itemForRoute(group.getAttribute('data-parent-route'));
          }
        }
        if (event.key === 'Enter' || event.key === ' ') {
          selectRoute(item.dataset.route, { updateHash: true, showDetail: true });
          event.preventDefault();
          return;
        }
        if (target) {
          items.forEach(function (candidate) { candidate.tabIndex = candidate === target ? 0 : -1; });
          target.focus();
          event.preventDefault();
        }
      });
    });

    toggles.forEach(function (toggle) {
      toggle.addEventListener('click', function () {
        var item = itemForRoute(toggle.dataset.route);
        setExpanded(item, toggle.getAttribute('aria-expanded') !== 'true');
      });
    });

    if (search) {
      search.addEventListener('input', function () {
        var query = search.value.trim().toLocaleLowerCase();
        var branches = Array.from(workspace.querySelectorAll('[data-tree-branch]'));
        branches.forEach(function (branch) {
          var item = branch.querySelector(':scope > [role="treeitem"]');
          var label = item && item.textContent.toLocaleLowerCase();
          branch.hidden = Boolean(query && !label.includes(query));
        });
        if (query) {
          branches.slice().reverse().forEach(function (branch) {
            var matchedChild = Array.from(branch.querySelectorAll(':scope > [role="group"] > [data-tree-branch]'))
              .some(function (child) { return !child.hidden; });
            if (matchedChild) {
              branch.hidden = false;
              var item = branch.querySelector(':scope > [role="treeitem"]');
              if (item) { setExpanded(item, true); }
            }
          });
        }
        if (searchEmpty) {
          var hasResult = branches.some(function (branch) {
            return !branch.hidden && !branch.closest('[data-tree-branch][hidden]');
          });
          searchEmpty.hidden = !query || hasResult;
        }
      });
    }

    if (back) {
      back.addEventListener('click', function () {
        workspace.classList.remove('is-detail');
        history.pushState(null, '', location.pathname + location.search);
        var selected = itemForRoute(selectedRoute);
        if (selected) { selected.focus(); }
      });
    }

    window.addEventListener('hashchange', function () {
      var detail = detailForHash(location.hash);
      if (!detail) { return; }
      var directRoute = detail.dataset.route;
      selectRoute(directRoute, { showDetail: true });
      var target = document.getElementById(String(location.hash).replace(/^#/, ''));
      if (target && target !== detail) {
        requestAnimationFrame(function () { target.scrollIntoView({ block: 'start' }); });
      }
    });

    var initialDetail = detailForHash(location.hash);
    selectRoute(
      initialDetail ? initialDetail.dataset.route : 'project-overview',
      { showDetail: Boolean(initialDetail) },
    );
  }

  (function restoreChecks() {
    document.querySelectorAll('input[type="checkbox"][data-review-check]').forEach(function (box) {
      var key = 'forge-review:' + box.getAttribute('data-storage-key');
      try { box.checked = localStorage.getItem(key) === '1'; } catch (e) {}
      box.addEventListener('change', function () {
        try { localStorage.setItem(key, box.checked ? '1' : '0'); } catch (e) {}
      });
    });
  })();

  initProjectWorkspace();
  wrapTables(document);
  renderDiagrams(document);
  document.documentElement.setAttribute('data-visual-docs-ready', 'true');
})();
</script>
